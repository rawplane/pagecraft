[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pagecraft"
version = "0.2.0"
description = "Convert images and HTML files into a single PDF"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "rawplane" }]
dependencies = [
    "img2pdf>=0.5.1",
    "Pillow>=10.0.0",
    "tqdm>=4.66.0",
    "weasyprint>=62.0",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
pagecraft = "pagecraft.cli:main"

[tool.setuptools.packages.find]
include = ["pagecraft*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # WeasyPrint's HarfBuzz-Subset warning is informational only.
    "ignore::DeprecationWarning:weasyprint.*",
    # The fork() warning from PIL/fontconfig is benign for our use case
    # (no Python-level locks are held; the parent's threads are C-level
    # fontconfig/Cairo threads). We use fork on Linux for speed.
    "ignore:.*use of fork\\(\\) may lead to deadlocks:DeprecationWarning",
]

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
